<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="format-detection"
      content="telephone=no, date=no, email=no, address=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Comming soon | Personal Site</title>
    <meta
      name="description"
      content="The personal site is being refreshed and will be online soon."
    />
    <meta
      name="keywords"
      content="Comming soon, personal site, launching soon, static website"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta property="og:title" content="Comming soon | Personal Site" />

      content="The page is being updated and the new version will be available soon."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="coming-page">
      <div class="ambient ambient-a" aria-hidden="true"></div>
      <div class="ambient ambient-b" aria-hidden="true"></div>
      <div class="grid-overlay" aria-hidden="true"></div>

      <main class="coming-stage" id="top">
        <p class="status-pill">SITE REFRESH / 2026</p>

        <div class="signal" aria-hidden="true">
          <span class="signal-bar"></span>
          <span class="signal-bar"></span>
          <span class="signal-bar"></span>
          <span class="signal-bar"></span>
          <span class="signal-bar"></span>
          <span class="signal-bar"></span>
          <span class="signal-bar"></span>
        </div>

        <h1 class="coming-title">Comming soon</h1>
        <p class="coming-copy">
          The site is being refreshed. New content, projects, and contact details
          will be back here soon.
        </p>

        <div class="coming-tags" aria-label="Current status">
          <span>Visual update in progress</span>
          <span>Portfolio details being reorganized</span>
          <span>Public launch pending</span>
        </div>
      </main>

      <footer class="coming-footer">
        <p>© <span id="year"></span> Kiloong's iLog</p>
      </footer>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
